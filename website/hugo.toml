# Hugo configuration for the BTC Map Android user documentation site.
#
# The pages live in content/ and the screenshots in static/images/. See
# website/README.md for how to build and preview the site.

# The URL the site is served from. It is used for absolute links and assets;
# `hugo server` overrides it with the local address, and `./devtools website
# deploy` publishes the build to this host.
baseURL = "https://android.btcmap.org/"
locale = "en"
title = "BTC Map Android"

# The content is documentation only, so the generated tag, category and RSS
# pages are noise.
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # Links in the documentation that point outside content/ (../../../README.md,
  # ../../AGENTS.md, ...) are rewritten to this repository.
  githubRepo = "https://github.com/teambtcmap/btcmap-android"

  # Sidebar order for the getting-started steps under content/getting-started/.
  gettingStarted = [
    "install",
    "first-launch",
    "permissions",
    "search",
    "try-it-out",
  ]

  # Sidebar order for the guides under content/features/. Keep in sync with the
  # listing in content/_index.md.
  features = [
    "map",
    "places",
    "events",
    "areas",
    "offline-maps",
    "comments",
    "boosting",
    "activity-feed",
    "accounts",
    "settings",
  ]
