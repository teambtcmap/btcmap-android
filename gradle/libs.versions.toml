[versions]
## Foundation
# Android Gradle Plugin
# https://developer.android.com/build/releases/gradle-plugin
agp = "9.4.0"
# This project is Kotlin-only
# https://github.com/JetBrains/kotlin/releases
kotlin = "2.4.20"
# Enables suspending functions
# https://github.com/Kotlin/kotlinx.coroutines/releases
coroutines = "1.11.0"

## Handy Android extensions
# Abstracts away platform-dependednt SQLite API
# https://developer.android.com/jetpack/androidx/releases/sqlite
androidx-sqlite = "2.7.1"
# Manages the shared activity and edge-to-edge setup
# https://developer.android.com/jetpack/androidx/releases/activity
androidx-activity = "1.13.0"
# Provides AppCompat widgets and theming
# https://developer.android.com/jetpack/androidx/releases/appcompat
androidx-appcompat = "1.8.0"
# Common Kotlin extensions for platform APIs
# https://developer.android.com/jetpack/androidx/releases/core
androidx-core = "1.19.0"
# Enables simplified fragment transactions
# https://developer.android.com/jetpack/androidx/releases/fragment
androidx-fragment = "1.9.0"
# Lifecycle-aware components and coroutine scopes
# https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-lifecycle = "2.11.0"
# Displays scrollable lists
# https://developer.android.com/jetpack/androidx/releases/recyclerview
androidx-recyclerview = "1.4.0"
# Enables horizontal swiping between pages
# https://developer.android.com/jetpack/androidx/releases/viewpager2
androidx-viewpager2 = "1.1.0"

# Material design components
# https://github.com/material-components/material-components-android/releases
material = "1.14.0"
# Modern HTTP client
# https://github.com/square/okhttp/blob/master/CHANGELOG.md
okhttp = "5.5.0"
# Map widget with vector support
# https://github.com/maplibre/maplibre-native/releases
maplibre = "13.6.1"
# Used for displaying LN invoices
# https://github.com/androidmads/QRGenerator/releases
qrgenerator = "1.0.5"
# Helps customize colors, when necessary
# https://github.com/mrudultora/Colorpicker/releases
colorpicker = "1.2.0"
# Image loading
# https://github.com/coil-kt/coil/releases
coil = "3.6.2"
# JSON parsing
# https://github.com/google/gson/releases
gson = "2.14.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-junit = "1.3.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-core = "1.7.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-runner = "1.7.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-espresso = "3.7.0"
# https://junit.org/junit4/
junit = "4.13.2"

[libraries]
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidx-sqlite" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidx-fragment" }
androidx-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidx-viewpager2" }

androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "android-test-junit" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "android-test-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "android-test-runner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "android-test-espresso" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
okhttp-brotli = { group = "com.squareup.okhttp3", name = "okhttp-brotli", version.ref = "okhttp" }
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
qrgenerator = { module = "com.github.androidmads:QRGenerator", version.ref = "qrgenerator" }
colorpicker = { module = "com.github.mrudultora:Colorpicker", version.ref = "colorpicker" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
