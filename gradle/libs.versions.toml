[versions]
## Foundation
# Android Gradle Plugin
# https://developer.android.com/build/releases/gradle-plugin
agp = "9.4.1"
# This project is Kotlin-only
# https://github.com/JetBrains/kotlin/releases
kotlin = "2.4.20"
# Compose Multiplatform
# https://github.com/JetBrains/compose-multiplatform/releases
compose-plugin = "1.12.1"
# AndroidX Compose UI, pinned to the version Compose Multiplatform resolves for
# the Android target (used by the instrumented test artifacts).
androidx-compose = "1.12.1"
# Enables suspending functions
# https://github.com/Kotlin/kotlinx.coroutines/releases
coroutines = "1.11.0"

## Handy Android extensions
# Abstracts away platform-dependednt SQLite API
# https://developer.android.com/jetpack/androidx/releases/sqlite
androidx-sqlite = "2.7.1"
# Manages the shared activity and edge-to-edge setup
# https://developer.android.com/jetpack/androidx/releases/activity
androidx-activity = "1.13.0"
# Provides AppCompat widgets and theming
# https://developer.android.com/jetpack/androidx/releases/appcompat
androidx-appcompat = "1.8.0"
# Common Kotlin extensions for platform APIs
# https://developer.android.com/jetpack/androidx/releases/core
androidx-core = "1.19.0"
# Enables simplified fragment transactions
# https://developer.android.com/jetpack/androidx/releases/fragment
androidx-fragment = "1.9.0"
# Lifecycle-aware components and coroutine scopes
# https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-lifecycle = "2.11.0"
# Displays scrollable lists
# https://developer.android.com/jetpack/androidx/releases/recyclerview
androidx-recyclerview = "1.4.0"
# Enables horizontal swiping between pages
# https://developer.android.com/jetpack/androidx/releases/viewpager2
androidx-viewpager2 = "1.1.0"
# Renders web pages in an in-app browser tab
# https://developer.android.com/jetpack/androidx/releases/browser
androidx-browser = "1.10.0"

# Material design components
# https://github.com/material-components/material-components-android/releases
material = "1.14.0"
# Modern HTTP client, used only by the MockWebServer test dependency now.
# https://github.com/square/okhttp/blob/master/CHANGELOG.md
okhttp = "5.5.0"

## KMP-clean libraries for the web-target spike (see webspike/)
# Multiplatform HTTP client, the OkHttp replacement on web
# https://ktor.io/
ktor = "3.6.0"
# Multiplatform JSON, the Gson replacement on web
# https://github.com/Kotlin/kotlinx.serialization/releases
kotlinx-serialization = "1.11.0"
# Multiplatform date/time, the java.time replacement on web
# https://github.com/Kotlin/kotlinx-datetime/releases
kotlinx-datetime = "0.8.0"
# Multiplatform IO, the java.io replacement on web
# https://square.github.io/okio/
okio = "3.18.2"
# Multiplatform atomics and locks, the java.util.concurrent replacement on web
# https://github.com/Kotlin/kotlinx.atomicfu
atomicfu = "0.33.0"
# MapLibre for Compose Multiplatform (shared map, Phase 3)
# https://github.com/maplibre/maplibre-compose/releases
maplibre-compose = "0.20.0"
# QR encoding for Lightning invoices, shared by every host.
# https://github.com/zxing/zxing/releases
zxing = "3.5.0"
# Pinyin for Han characters, drawn as ruby over a POI's Chinese name (sheet
# only). jpinyin is pure Java with no runtime dependencies, so it serves both the
# Android and JVM hosts. (TinyPinyin is not on Maven Central.)
# https://github.com/stuxuhai/jpinyin
jpinyin = "1.1.8"

# Image loading
# https://github.com/coil-kt/coil/releases
coil = "3.6.3"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-junit = "1.3.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-core = "1.7.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-runner = "1.7.0"
# https://developer.android.com/jetpack/androidx/releases/test
android-test-espresso = "3.7.0"
# https://junit.org/junit4/
junit = "4.13.2"

[libraries]
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidx-sqlite" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidx-fragment" }
androidx-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidx-viewpager2" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidx-browser" }

androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "android-test-junit" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "android-test-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "android-test-runner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "android-test-espresso" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre-compose" }
maplibre-compose-runtime-opengl-android = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibre-compose" }
maplibre-compose-runtime-opengl-linux-x64 = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-linux-x64", version.ref = "maplibre-compose" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
jpinyin = { module = "com.github.stuxuhai:jpinyin", version.ref = "jpinyin" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

# KMP-clean replacements used by the webspike module.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
androidx-sqlite-web = { module = "androidx.sqlite:sqlite-web", version.ref = "androidx-sqlite" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidx-compose" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "androidx-compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Builds an Android target for a Kotlin Multiplatform module. Required because
# AGP 9 no longer supports `com.android.library` alongside the KMP plugin.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
