// A debuggable build of the desktop app, used by
// `CONVEYOR_DEBUG=1 ./devtools app deploy-beta|deploy-release`. The packages are
// otherwise identical, and still signed with the same key and published to the
// same channel.
//
// Signing costs two of the JVM's diagnostic doors, and Conveyor closes a third
// on purpose: a signed Windows or macOS launcher is built with
// -XX:+DisableAttachMechanism (visible in the shipped `BTC Map.exe`), because the
// attach mechanism lets any local user rewrite the running program's code in
// memory and defeat code signing. That is why a running Windows build could not
// be inspected with a Java agent or a thread dump. This config opens it again,
// and adds the rest of what a field diagnosis needs.
include required("conveyor.conf")

app.jvm {
  // Re-enable the JVM attach mechanism, so jcmd/jstack/jmap/jconsole and
  // profilers can reach the process. Deliberately absent from the normal build.
  options += "-XX:-DisableAttachMechanism"
  // A JDWP port for a remote debugger. Bound to loopback, so it is not exposed
  // to the network without a tunnel.
  options += "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005"
  // Crash logs and heap dumps into the app's data directory, which is writable,
  // instead of the package's install directory, which is not.
  options += "-XX:ErrorFile=~/.btcmap/hs_err_pid%p.log"
  options += "-XX:+HeapDumpOnOutOfMemoryError"
  options += "-XX:HeapDumpPath=~/.btcmap"

  // The linked runtime is minimal, built from the modules `jdeps` detects, and
  // the attach protocol's target side lives in this module: without it `jcmd`
  // and friends are refused even with the attach mechanism enabled.
  modules += jdk.attach

  // Attach the launcher to a console: the app's own startup output and the
  // launcher's then appear in the terminal, and Ctrl+Break there prints a full
  // thread dump without needing to attach at all. It opens a console window when
  // the app is started from Explorer, which is why the normal build leaves it off.
  gui.console = true
}
