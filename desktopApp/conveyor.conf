// The desktop packages Conveyor builds: an MSIX (plus its installer .exe and a
// plain .zip) for Windows and a signed, Sparkle-updating .app archive for Apple
// Silicon macOS. Conveyor builds them from any host OS, which is the reason it
// is here at all — the Compose plugin's own jpackage tasks cannot cross-compile
// and silently skip the Windows and macOS formats on Linux.
//
// The version, main class, JVM options and the per-platform native runtimes all
// come from the Gradle build. The include below is generated by
// `./gradlew :desktopApp:writeConveyorConfig`, which the deploy commands run for
// you; regenerate it after changing dependencies or the version.
include required("generated.conveyor.conf")

app {
  display-name = BTC Map
  // The generated config fills fsname from the Compose plugin's packageName,
  // which is "BTC Map"; Conveyor requires a kebab-case fsname, so it is set here
  // (it names the install directory, the executable and the package).
  fsname = btc-map
  // The reverse-DNS package identifier, and the vendor, description and licence
  // the installers carry. `license` is an SPDX identifier: Conveyor is free for
  // open-source apps, and it reads this to establish that.
  rdns-name = org.btcmap
  vendor = BTC Map
  description = "Map of places that accept bitcoin"
  license = AGPL-3.0-only
  // The source repository, which is the other half of Conveyor's open-source
  // terms: it locates the project and establishes that it is licensed for a
  // free build. Do not remove it without a paid licence key.
  vcs-url = "https://github.com/teambtcmap/btcmap-android"

  // One square, transparent icon is enough: Conveyor rescales it to every size
  // Windows and macOS need. This is the Play Store icon.
  icons = "../fastlane/metadata/android/en-US/images/icon.png"

  // Windows x64 and Apple Silicon macOS only. Linux is packaged on this machine
  // by jpackage into the beta AppImage, and MapLibre Compose publishes no macOS
  // x64 native runtime at all, so Intel Macs cannot be supported.
  machines = [ windows.amd64, mac.aarch64 ]

  // Deliberately no `java.library.path` override here. The packaged Windows build
  // does not start (see AGENTS.md, "Cross-platform packaging"): Conveyor bakes
  // `-Djava.library.path=<app dir>;<root>\bin` into the launcher, so the system
  // directories a plain JVM has implicitly are gone, and MapLibre's Windows
  // native runtime cannot load the system libraries it needs. Working around it
  // from this config is possible but means naming `C:\Windows` literally —
  // Conveyor resolves `${env.*}` when it reads this file, on the build machine,
  // and the launcher expands no environment variables — while pinning the
  // launcher's own directory list. Left to a fix upstream instead.

  // Where the packages are served from, and therefore where the Windows and
  // macOS apps check for updates. `deploy-beta` and `prepare-release` override
  // this per channel with -Kapp.site.base-url=...; the channel is the last path
  // segment, so an installed copy only ever checks its own.
  site.base-url = "https://cdn.static.btcmap.org/desktop/beta"

  // The beta channel replaces the files in place rather than accumulating
  // releases, so it must not be a site Conveyor keeps version history in; the
  // deploy script purges the CDN afterwards for the same reason.
  updates = background
}

// The signing root key is not named here: it is signing material, so it lives
// outside the repository beside the Android keystore, and local.properties points
// at it with `conveyor.signing.key`. Losing it breaks updates for every installed
// copy, so back it up; `conveyor keys export` moves it between machines.

conveyor.compatibility-level = 23
